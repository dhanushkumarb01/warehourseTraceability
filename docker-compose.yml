# WareTrace — full local stack.
#
#   cp .env.example .env
#   docker compose up --build                      # db, backend, frontend, ai-worker
#   open http://localhost:8088
#   docker compose --profile tunnel up --build     # + ngrok tunnel to the AI worker
#
# One-shot seeds (migrations run automatically first):
#   docker compose run --rm backend npm run seed:admin
#   docker compose run --rm backend npm run seed:demo
#   docker compose run --rm backend npm run seed:trucks

name: waretrace

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waretrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waretrace}
      POSTGRES_DB: ${POSTGRES_DB:-warehouse_traceability}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [waretrace]
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-waretrace}:${POSTGRES_PASSWORD:-waretrace}@db:5432/${POSTGRES_DB:-warehouse_traceability}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8088}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?set AI_SERVICE_TOKEN in .env}
      CAMERA_ENC_KEY: ${CAMERA_ENC_KEY:-}
      AI_ENROLLMENT_URL: http://ai-worker:8600
      SAP_MODE: ${SAP_MODE:-mock}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - backend-storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    networks: [waretrace]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the bundle; the browser calls this URL directly.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api}
    ports:
      - "${FRONTEND_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks: [waretrace]
    restart: unless-stopped

  ai-worker:
    build: ./ai-service
    environment:
      WARETRACE_API_URL: ${WARETRACE_API_URL:-http://backend:5000}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?set AI_SERVICE_TOKEN in .env}
      AI_LOG_LEVEL: ${AI_LOG_LEVEL:-INFO}
    ports:
      - "${AI_WORKER_PORT:-8600}:8600"
    volumes:
      - ai-cache:/app/.cache
      - ai-models:/home/app/.insightface
    depends_on:
      backend:
        condition: service_healthy
    networks: [waretrace]
    restart: unless-stopped

  # Public HTTPS URL for the worker's face-enrollment API, so a cloud backend
  # (AI_ENROLLMENT_URL) can reach it. Opt-in: needs an ngrok account.
  ngrok:
    # No healthcheck: Docker cannot exec into this image (its /etc/passwd and
    # /etc/group are absolute symlinks). Check https://<NGROK_DOMAIN>/health instead.
    image: ngrok/ngrok:3
    profiles: [tunnel]
    command: ["http", "--url=${NGROK_DOMAIN:-}", "--log=stdout", "ai-worker:8600"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on:
      ai-worker:
        condition: service_healthy
    networks: [waretrace]
    restart: unless-stopped

volumes:
  db-data:
  backend-storage:
  ai-cache:
  ai-models:

networks:
  waretrace:
