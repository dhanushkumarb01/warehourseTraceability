# Render Blueprint — backend API only (frontend is on Vercel; ai-service is not deployed).
# Secrets use `sync: false`: Render prompts for their values when the Blueprint is applied.
services:
  - type: web
    name: warehouse-traceability-api
    runtime: node
    plan: free
    region: ohio # closest to the Neon DB in us-east-2
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: SAP_MODE
        value: mock
      # migrate deploy runs through Neon's PgBouncer pooler, where Prisma's
      # session-level advisory lock can stay held and time out the next build
      # (P1002). Only this single build ever migrates, so the lock is not needed.
      - key: PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CAMERA_ENC_KEY
        sync: false
      - key: AI_SERVICE_TOKEN
        sync: false
      # The AI worker's face-enrollment API, exposed on a static ngrok domain.
      - key: AI_ENROLLMENT_URL
        value: https://alexia-intertribal-nonsubtractively.ngrok-free.dev
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin@example.com
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
